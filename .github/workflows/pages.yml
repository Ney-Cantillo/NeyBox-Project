name: Publish NeyBox APT Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare GitHub Pages
        run: |
          rm -rf _site
          mkdir -p _site/apt/debian

          cp -r apt/debian/dists _site/apt/debian/
          cp -r apt/debian/pool _site/apt/debian/

      - name: Generate package index
        run: |
          python3 <<'PY'
          import os
          import subprocess
          import hashlib
          import html

          root = "apt/debian/pool"
          packages = []

          for base, dirs, files in os.walk(root):
              for filename in files:
                  if not filename.endswith(".deb"):
                      continue

                  path = os.path.join(base, filename)
                  rel = os.path.relpath(path, root)
                  url = "apt/debian/pool/" + rel

                  def field(name):
                      result = subprocess.run(
                          ["dpkg-deb", "-f", path, name],
                          capture_output=True,
                          text=True
                      )
                      return result.stdout.strip()

                  size = os.path.getsize(path)

                  with open(path, "rb") as f:
                      sha256 = hashlib.sha256(f.read()).hexdigest()

                  packages.append({
                      "package": field("Package"),
                      "version": field("Version"),
                      "architecture": field("Architecture"),
                      "maintainer": field("Maintainer"),
                      "description": field("Description"),
                      "size": size,
                      "sha256": sha256,
                      "url": url
                  })

          cards = []

          for pkg in packages:
              cards.append(f"""
              <article class="package">
                <h2>{html.escape(pkg["package"])}</h2>
                <p>{html.escape(pkg["description"])}</p>

                <dl>
                  <dt>Version</dt>
                  <dd>{html.escape(pkg["version"])}</dd>

                  <dt>Architecture</dt>
                  <dd>{html.escape(pkg["architecture"])}</dd>

                  <dt>Maintainer</dt>
                  <dd>{html.escape(pkg["maintainer"])}</dd>

                  <dt>Size</dt>
                  <dd>{pkg["size"]:,} bytes</dd>

                  <dt>SHA256</dt>
                  <dd><code>{pkg["sha256"]}</code></dd>
                </dl>

                <a class="download"
                   href="{html.escape(pkg["url"])}">
                  Download .deb
                </a>
              </article>
              """)

          package_html = "\n".join(cards)

          if not package_html:
              package_html = """
              <p>No .deb packages were found in the repository.</p>
              """

          index = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport"
                  content="width=device-width, initial-scale=1.0">

            <title>NeyBox APT Repository</title>

            <style>
              body {{
                font-family: system-ui, sans-serif;
                max-width: 900px;
                margin: auto;
                padding: 2rem;
                background: #111;
                color: #eee;
              }}

              h1 {{
                margin-bottom: 0.3rem;
              }}

              .subtitle {{
                color: #aaa;
              }}

              .package {{
                border: 1px solid #333;
                border-radius: 12px;
                padding: 1.2rem;
                margin-top: 1rem;
                background: #1a1a1a;
              }}

              dl {{
                display: grid;
                grid-template-columns: 150px 1fr;
                gap: 0.4rem 1rem;
              }}

              dt {{
                color: #aaa;
              }}

              dd {{
                margin: 0;
                overflow-wrap: anywhere;
              }}

              code {{
                font-size: 0.85rem;
              }}

              .download {{
                display: inline-block;
                margin-top: 1rem;
                padding: 0.7rem 1rem;
                border-radius: 8px;
                background: #fff;
                color: #111;
                text-decoration: none;
                font-weight: bold;
              }}
            </style>
          </head>

          <body>
            <h1>NeyBox APT Repository</h1>

            <p class="subtitle">
              Debian / Ubuntu ARM64
            </p>

            <h2>Available packages</h2>

            {package_html}

            <h2>APT configuration</h2>

            <pre>
          deb [trusted=yes] https://kassandraruaortega-del.github.io/NeyBox-Project/apt/debian bookworm main
            </pre>
          </body>
          </html>
          """

          with open("_site/index.html", "w", encoding="utf-8") as f:
              f.write(index)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
